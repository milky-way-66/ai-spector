# Prototype hosting — nginx config (poc.dev.kaopiz.com)

# Deploy layout on disk (per project version):
#   /var/www/{project}/{version}/current/
#     src/           ← static HTML (buildMode: static)
#       login.html
#       assets/…
#     dist/          ← SPA build (buildMode: spa)
#       index.html
#       assets/…
#
# Public URL pattern (versioned layout):
#   https://poc.dev.kaopiz.com/{project}/{version}/{prototypePath}
#
# Flat layout (no project/version) is also valid — see reviewUrl in screen-map.json.
#
# prototypePath comes from prototype/screen-map.json (see url-mapping-handover.md).

server {
    server_name poc.dev.kaopiz.com;

    # Version root — prefer SPA entry, then static index, then repo root index
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};

        root /var/www;
        try_files /$project/$version/current/dist/index.html
                  /$project/$version/current/src/index.html
                  /$project/$version/current/index.html =404;
    }

    location = / {
        root /var/www;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(index\.html|favicon\.ico|robots\.txt)$ {
        root /var/www;
    }

    # SPA hashed assets under /assets/ (Vite default)
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/assets/(?<asset>.+\.(?:js|css|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp))$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current/dist/assets/$asset
                  /$project/$version/current/out/assets/$asset =404;
    }

    # SPA bundle assets (dist|out/…/file.ext or dist|out/assets/file.ext)
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/(?<bundle>dist|out)/(?:[^/]+/)*(?<asset>.+\.(?:js|css|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp))$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current/$bundle/$asset
                  /$project/$version/current/$bundle/assets/$asset =404;
    }

    # SPA client routes — any path under dist|out falls back to index.html
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/(?<bundle>dist|out)/?(?<route>.*?)/?$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current/$bundle/index.html =404;
    }

    # Static HTML pages (explicit .html under src/)
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/src/(?<page>.+\.html)$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current/src/$page =404;
    }

    # Static assets co-located with HTML (src/assets/, src/*.css, etc.)
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)/src/(?<asset>.+)$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current/src/$asset =404;
    }

    # Catch-all files under project version (fallback)
    location ~ ^/(?<project>[^/]+)/(?<version>[^/]+)(?<rest>/.*)?$ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd/${project}_${version};
        root /var/www;
        try_files /$project/$version/current$rest =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/poc.dev.kaopiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poc.dev.kaopiz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = poc.dev.kaopiz.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name poc.dev.kaopiz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
